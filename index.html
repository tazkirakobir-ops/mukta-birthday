<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MUKTA_OS 💗</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #c9b6ff, #ffd6e8, #aeebff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .window {
      width: 90%;
      max-width: 500px;
      background: #f5f5f5;
      border: 3px solid white;
      border-radius: 15px;
      box-shadow: 8px 8px 0 #ff71ce;
      padding: 30px;
      text-align: center;
    }

    .title-bar {
      background: linear-gradient(90deg, #ff71ce, #c9b6ff);
      color: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 25px;
      font-weight: bold;
    }

    h1 {
      color: #2d2140;
      font-size: 30px;
      margin-bottom: 15px;
    }

    p {
      color: #555;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      background: #ff71ce;
      color: white;
      border: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 4px 4px 0 #c9b6ff;
    }

    button:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }
  </style>
</head>

<body>

  <div class="window">
    <div class="title-bar">MUKTA_OS.exe 💿</div>

    <h1>Hey Mukta! 💗</h1>

    <p>
      You have received a very special notification...
      <br><br>
      Something made especially for you is waiting inside. 👀✨
    </p>

    <button onclick="alert('SURPRISE LOADING... 💗')">
      OPEN 🎁
    </button>
  </div>






  
</body>
</html>
